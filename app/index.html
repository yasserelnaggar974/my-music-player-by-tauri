<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Music Player</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="app" id="dropzone">
    <section class="stage">
      <canvas id="visualizer" aria-hidden="true"></canvas>
      <div class="now">
        <p class="now-title" id="trackTitle">No track loaded</p>
        <p class="now-sub" id="trackSub">Add files to start listening</p>
      </div>
    </section>

    <section class="controls">
      <div class="seek">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekBar" min="0" max="100" step="0.1" value="0" aria-label="Seek">
        <span id="duration">0:00</span>
      </div>

      <div class="buttons">
        <button id="shuffleBtn" class="toggle" aria-pressed="false" title="Shuffle">Shuffle</button>
        <button id="prevBtn" class="icon" title="Previous (Shift + ←)" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
        <button id="playBtn" class="icon play" title="Play / Pause (Space)" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="nextBtn" class="icon" title="Next (Shift + →)" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <button id="repeatBtn" class="toggle" aria-pressed="false" title="Repeat">Repeat: off</button>
      </div>

      <div class="volume">
        <label for="volumeBar">Volume</label>
        <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.8">
      </div>
    </section>

    <section class="library">
      <div class="library-head">
        <h2>Playlist <span id="count">(0)</span></h2>
        <div class="library-actions">
          <label class="btn" for="fileInput">Add files</label>
          <input type="file" id="fileInput" accept="audio/*,.mp3,.flac,.m4a,.wav,.ogg,.aac" multiple hidden>
          <button id="clearBtn" class="ghost">Clear</button>
        </div>
      </div>
      <ol id="playlist" class="playlist"></ol>
      <p class="empty" id="emptyMsg">Click “Add files” or drag and drop tracks anywhere on this page.</p>
    </section>

    <audio id="audio" preload="metadata"></audio>
  </main>

  <script src="./src/player.js"></script>
</body>
</html>
